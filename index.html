<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Guía de Flora · Parque Oncol</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Botón volver (esquina superior izquierda con pila de navegación) -->
  <button id="btn-back" class="back-button" aria-label="Volver" onclick="goBack()">←</button>

  <!-- PANTALLA 1: Bienvenida -->
  <div id="screen-welcome" class="screen active">
    <div class="welcome-content">
      <div class="logo-placeholder">🌿</div>
      <h1 class="welcome-title">Guía de Flora</h1>
      <p class="welcome-subtitle">Parque Oncol · Selva Valdiviana</p>
      <div id="welcome-stats" class="welcome-stats">Cargando catálogo...</div>
      <button class="btn-start" onclick="navigateTo('subcategories')">Explorar Flora</button>
    </div>
  </div>

  <!-- PANTALLA 2: Subcategorías de Flora con Buscador Global -->
  <div id="screen-subcategories" class="screen">
    <div class="screen-header">
      <h2 id="subcategory-title">Flora de Oncol</h2>
      <p id="subcategory-subtitle" class="screen-subtitle">Selecciona una categoría o busca una especie</p>
    </div>

    <!-- Buscador global en todo el catálogo de flora -->
    <div class="search-container">
      <input 
        type="search" 
        id="global-search" 
        placeholder="🔍 Buscar especie (ej. Canelo, Luma, Helecho)..." 
        aria-label="Buscar especie"
        oninput="handleGlobalSearch(this.value)"
      >
    </div>

    <div id="subcategory-container" class="circle-container">
      <!-- Generado dinámicamente desde especies.json -->
    </div>
  </div>

  <!-- PANTALLA 3: Lista / Carrusel de especies -->
  <div id="screen-species-list" class="screen">
    <div class="screen-header">
      <h2 id="species-list-title">Especies</h2>
      <p id="species-list-subtitle" class="screen-subtitle">0 especies encontradas</p>
    </div>

    <div id="species-carousel" class="carousel">
      <!-- Especies cargadas dinámicamente con mini-logo UICN en esquina superior derecha -->
    </div>
  </div>

  <!-- PANTALLA 4: Ficha detallada de la especie (con menús desplegables) -->
  <div id="screen-species-detail" class="screen">
    <div class="detail-card">
      
      <!-- HERO: 2 Columnas (Píldoras técnicas 2 líneas a la izquierda, foto con logo UICN a la derecha) -->
      <div class="detail-hero">
        <div id="detail-badges" class="detail-badges-column">
          <!-- Píldoras de 2 líneas generadas dinámicamente -->
        </div>

        <div class="detail-photo-wrapper">
          <div id="detail-image" class="detail-image">🌿</div>
          <div id="detail-iucn-slot">
            <!-- Logo oficial UICN circular ubicado en la esquina superior derecha de la foto -->
          </div>
        </div>
      </div>

      <!-- Títulos taxonómicos -->
      <div class="detail-header-info">
        <h2 id="detail-common-name">Nombre Común</h2>
        <p id="detail-scientific-name">Nombre científico</p>
        <p id="detail-family" class="detail-family">Familia: ...</p>
      </div>

      <!-- Contenido textual con scroll interno para lectura en móvil -->
      <div id="detail-sections" class="detail-extended-content">
        <!-- Cómo reconocerla + Dato curioso (visibles) + Acordeones desplegables -->
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
